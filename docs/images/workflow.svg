<text x="1212" y="729" font-size="27" fill="#f0cb8d" font-weight="650" class="" text-anchor="middle">保持不变</text>
<text x="1212" y="760" font-size="19" fill="#a9b9cc" font-weight="400" class="" text-anchor="middle">不重复追加，不制造改动</text>
